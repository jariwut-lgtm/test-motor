<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mobile AR Lab - Wind Turbine</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // คอมโพเนนต์สั่งหมุนใบพัดรอบแกน Z
    AFRAME.registerComponent('spin-control', {
      schema: {
        axis: { type: 'string', default: 'z' },
        speed: { type: 'number', default: 220 },
        active: { type: 'boolean', default: true }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;
        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        if (this.data.axis === 'z') this.el.object3D.rotation.z += radians;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const rotor = document.querySelector('#rotor');
      const turbineBody = document.querySelector('#turbine-body');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');

      let running = true;
      let warning = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — โมเดลกังหันลมพร้อมใช้งาน<span class="hint">แตะปุ่มด้านล่างเพื่อควบคุมใบพัด</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอ</span>';
      });

      runButton.addEventListener('click', () => {
        running = !running;
        rotor.setAttribute('spin-control', 'active', running);
        runButton.textContent = running ? 'หยุดกังหัน' : 'เริ่มกังหัน';
      });

      statusButton.addEventListener('click', () => {
        warning = !warning;

        if (warning) {
          turbineBody.setAttribute('color', '#ef5350');
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'WIND TURBINE T1\nSTATUS: WARNING');
          statusButton.textContent = 'เปลี่ยนเป็นปกติ';
        } else {
          turbineBody.setAttribute('color', '#ffffff');
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'WIND TURBINE T1\nSTATUS: NORMAL');
          statusButton.textContent = 'จำลองคำเตือน';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">หยุดกังหัน</button>
    <button id="status-button" type="button">จำลองคำเตือน</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
    >
      <!-- 1. ฐานรากกังหันลม (Concrete Base) -->
      <a-cylinder position="0 0.02 0" radius="0.5" height="0.04" color="#37474f"></a-cylinder>

      <!-- 2. เสากังหันลมทรงสูง (Wind Turbine Tower) -->
      <a-cone
        position="0 1.1 0"
        radius-bottom="0.14"
        radius-top="0.07"
        height="2.1"
        color="#eceff1"
      ></a-cone>

      <!-- 3. ห้องเครื่องกังหันลม (Nacelle) -->
      <a-box
        id="turbine-body"
        position="0 2.18 0"
        width="0.3"
        height="0.3"
        depth="0.7"
        color="#ffffff"
      ></a-box>

      <!-- ไฟเตือนบนยอดห้องเครื่อง -->
      <a-sphere
        id="warning-lamp"
        position="0 2.38 -0.1"
        radius="0.05"
        color="#00e676"
        material="emissive: #00c853; emissiveIntensity: 0.8"
      ></a-sphere>

      <!-- 4. ชุดหัวหมุนและใบพัด 3 ใบ (Rotor & 3 Blades) -->
      <a-entity
        id="rotor"
        position="0 2.18 0.38"
        spin-control="axis: z; speed: 220; active: true"
      >
        <!-- หัวแกนกังหัน (Hub Nose Cone) -->
        <a-cone
          position="0 0 0.06"
          rotation="90 0 0"
          radius-bottom="0.14"
          radius-top="0.03"
          height="0.18"
          color="#cfd8dc"
        ></a-cone>

        <!-- ใบพัดที่ 1 (ชี้ขึ้น 0 องศา) -->
        <a-entity rotation="0 0 0">
          <a-box position="0 0.65 0" width="0.08" height="1.1" depth="0.015" color="#ffffff"></a-box>
        </a-entity>

        <!-- ใบพัดที่ 2 (เอียง 120 องศา) -->
        <a-entity rotation="0 0 120">
          <a-box position="0 0.65 0" width="0.08" height="1.1" depth="0.015" color="#ffffff"></a-box>
        </a-entity>

        <!-- ใบพัดที่ 3 (เอียง 240 องศา) -->
        <a-entity rotation="0 0 240">
          <a-box position="0 0.65 0" width="0.08" height="1.1" depth="0.015" color="#ffffff"></a-box>
        </a-entity>
      </a-entity>

      <!-- ป้ายข้อความ AR -->
      <a-text
        id="ar-label"
        value="WIND TURBINE T1\nSTATUS: NORMAL"
        position="0 2.85 0"
        rotation="-90 0 0"
        align="center"
        width="2.6"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
