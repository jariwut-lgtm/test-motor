<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - Wind Turbine Status</title>

  <!-- Open-source libraries pinned for compatibility -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // Component for rotating the turbine blades
    AFRAME.registerComponent('spin-control', {
      schema: {
        axis: { type: 'string', default: 'z' },
        speed: { type: 'number', default: 180 },
        active: { type: 'boolean', default: true }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;

        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        const axis = this.data.axis;

        if (axis === 'x') this.el.object3D.rotation.x += radians;
        if (axis === 'y') this.el.object3D.rotation.y += radians;
        if (axis === 'z') this.el.object3D.rotation.z += radians;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const rotor = document.querySelector('#rotor');
      const turbineBody = document.querySelector('#turbine-body');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');

      let running = true;
      let warning = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — โมเดลกังหันลมพร้อมใช้งาน<span class="hint">แตะปุ่มด้านล่างเพื่อทดลองควบคุม</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอและให้เห็นกรอบดำครบทั้งสี่ด้าน</span>';
      });

      runButton.addEventListener('click', () => {
        running = !running;
        rotor.setAttribute('spin-control', 'active', running);
        runButton.textContent = running ? 'หยุดกังหัน' : 'เริ่มกังหัน';
      });

      statusButton.addEventListener('click', () => {
        warning = !warning;

        if (warning) {
          turbineBody.setAttribute('color', '#ef5350');
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'WIND TURBINE T1\nSTATUS: WARNING');
          statusButton.textContent = 'เปลี่ยนเป็นปกติ';
        } else {
          turbineBody.setAttribute('color', '#ffffff');
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'WIND TURBINE T1\nSTATUS: NORMAL');
          statusButton.textContent = 'จำลองคำเตือน';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">หยุดกังหัน</button>
    <button id="status-button" type="button">จำลองคำเตือน</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- Base Foundation -->
      <a-cylinder
        position="0 0.02 0"
        radius="0.55"
        height="0.04"
        color="#455a64"
        roughness="0.8"
      ></a-cylinder>

      <a-cylinder
        position="0 0.06 0"
        radius="0.28"
        height="0.06"
        color="#263238"
      ></a-cylinder>

      <!-- Wind Turbine Tower -->
      <a-cone
        position="0 1.0 0"
        radius-bottom="0.18"
        radius-top="0.1"
        height="1.82"
        color="#eceff1"
        roughness="0.4"
      ></a-cone>

      <!-- Nacelle (Main Body at Top) -->
      <a-box
        id="turbine-body"
        position="0 1.95 0"
        width="0.32"
        height="0.34"
        depth="0.75"
        color="#ffffff"
        roughness="0.3"
      ></a-box>

      <!-- Status Lamp on top of Nacelle -->
      <a-sphere
        id="warning-lamp"
        position="0 2.18 -0.1"
        radius="0.06"
        color="#00e676"
        material="emissive: #00c853; emissiveIntensity: 0.8"
      ></a-sphere>

      <!-- Rotor Assembly (Blades and Hub spinning on Z-axis) -->
      <a-entity
        id="rotor"
        position="0 1.95 0.4"
        spin-control="axis: z; speed: 200; active: true"
      >
        <!-- Rotor Nose Cone (Hub) -->
        <a-cone
          position="0 0 0.08"
          rotation="90 0 0"
          radius-bottom="0.16"
          radius-top="0.04"
          height="0.22"
          color="#cfd8dc"
        ></a-cone>

        <!-- Blade 1 (0 deg) -->
        <a-entity rotation="0 0 0">
          <a-box
            position="0 0.55 0"
            width="0.07"
            height="0.9"
            depth="0.02"
            color="#ffffff"
            roughness="0.2"
          ></a-box>
        </a-entity>

        <!-- Blade 2 (120 deg) -->
        <a-entity rotation="0 0 120">
          <a-box
            position="0 0.55 0"
            width="0.07"
            height="0.9"
            depth="0.02"
            color="#ffffff"
            roughness="0.2"
          ></a-box>
        </a-entity>

        <!-- Blade 3 (240 deg) -->
        <a-entity rotation="0 0 240">
          <a-box
            position="0 0.55 0"
            width="0.07"
            height="0.9"
            depth="0.02"
            color="#ffffff"
            roughness="0.2"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- AR information label -->
      <a-text
        id="ar-label"
        value="WIND TURBINE T1\nSTATUS: NORMAL"
        position="0 2.55 0"
        rotation="-90 0 0"
        align="center"
        width="2.6"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
