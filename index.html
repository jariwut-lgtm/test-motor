<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mobile AR Lab - Running Rabbits</title>

  <!-- Open-source libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // คอมโพเนนต์หมุนกลุ่มกระต่ายเป็นวงกลมรอบแกน Y
    AFRAME.registerComponent('spin-control', {
      schema: {
        axis: { type: 'string', default: 'y' },
        speed: { type: 'number', default: 120 },
        active: { type: 'boolean', default: true }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;
        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        if (this.data.axis === 'y') this.el.object3D.rotation.y += radians;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const rabbitGroup = document.querySelector('#rabbit-group');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');
      const rabbitBodies = document.querySelectorAll('.rabbit-body');

      let running = true;
      let warning = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — ฝูงกระต่ายพร้อมวิ่ง<span class="hint">แตะปุ่มด้านล่างเพื่อสั่งการ</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอ</span>';
      });

      runButton.addEventListener('click', () => {
        running = !running;
        rabbitGroup.setAttribute('spin-control', 'active', running);
        
        // สลับสถานะการกระโดดของกระต่ายทุกตัว
        const animatedEntities = document.querySelectorAll('[animation]');
        animatedEntities.forEach(el => {
          if (running) {
            el.play();
          } else {
            el.pause();
          }
        });

        runButton.textContent = running ? 'หยุดวิ่ง' : 'เริ่มวิ่ง';
      });

      statusButton.addEventListener('click', () => {
        warning = !warning;

        if (warning) {
          // กระต่ายโหมดตื่นตระหนก (เปลี่ยนตัวเป็นสีแดง/ส้ม)
          rabbitBodies.forEach(b => b.setAttribute('color', '#ff8a80'));
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'RABBITS: PANIC MODE!\nSPEED: FAST');
          rabbitGroup.setAttribute('spin-control', 'speed', 240); // วิ่งเร็วขึ้น
          statusButton.textContent = 'เปลี่ยนเป็นปกติ';
        } else {
          // กลับสู่โหมดปกติ (ตัวสีขาว)
          rabbitBodies.forEach(b => b.setAttribute('color', '#ffffff'));
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'RABBITS: HAPPY RUNNING\nSTATUS: NORMAL');
          rabbitGroup.setAttribute('spin-control', 'speed', 120);
          statusButton.textContent = 'จำลองตื่นตระหนก';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">หยุดวิ่ง</button>
    <button id="status-button" type="button">จำลองตื่นตระหนก</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
    >
      <!-- 1. ฐานสนามหญ้า (Grass Meadow Platform) -->
      <a-cylinder position="0 0.02 0" radius="0.75" height="0.04" color="#4caf50" roughness="0.9"></a-cylinder>
      <!-- ลู่วิ่งวงกลม (Dirt Track Ring) -->
      <a-ring position="0 0.045 0" rotation="-90 0 0" radius-inner="0.38" radius-outer="0.62" color="#8d6e63"></a-ring>
      
      <!-- ตกแต่งตรงกลาง: แครอทยักษ์ (Center Landmark) -->
      <a-cone position="0 0.2 0" rotation="180 0 0" radius-bottom="0.12" radius-top="0.01" height="0.35" color="#ff9800"></a-cone>
      <a-sphere position="0 0.38 0" radius="0.08" color="#4caf50" scale="1 0.3 1"></a-sphere>

      <!-- ไฟเตือนสถานะกลางสนาม -->
      <a-sphere
        id="warning-lamp"
        position="0 0.5 0"
        radius="0.05"
        color="#00e676"
        material="emissive: #00c853; emissiveIntensity: 0.8"
      ></a-sphere>

      <!-- 2. กลุ่มกระต่ายวิ่งเป็นวงกลม (Rabbit Group) -->
      <a-entity
        id="rabbit-group"
        position="0 0 0"
        spin-control="axis: y; speed: 120; active: true"
      >
        <!-- กระต่ายตัวที่ 1 (ทิศ 0 องศา) -->
        <a-entity position="0.5 0 0" rotation="0 0 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.22 0; dir: alternate; loop: true; dur: 250; easing: easeInOutSine">
            <!-- ลำตัว -->
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.1" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <!-- หัว -->
            <a-sphere class="rabbit-body" position="0 0.08 0.1" radius="0.07" color="#ffffff"></a-sphere>
            <!-- หูซ้าย-ขวา -->
            <a-cylinder position="-0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <!-- ตา -->
            <a-sphere position="-0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <!-- หาง -->
            <a-sphere position="0 0.04 -0.12" radius="0.035" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 2 (ทิศ 90 องศา) -->
        <a-entity position="0 0 -0.5" rotation="0 270 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.22 0; dir: alternate; loop: true; dur: 250; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.1" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.08 0.1" radius="0.07" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0 0.04 -0.12" radius="0.035" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 3 (ทิศ 180 องศา) -->
        <a-entity position="-0.5 0 0" rotation="0 180 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.22 0; dir: alternate; loop: true; dur: 250; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.1" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.08 0.1" radius="0.07" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0 0.04 -0.12" radius="0.035" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 4 (ทิศ 270 องศา) -->
        <a-entity position="0 0 0.5" rotation="0 90 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.22 0; dir: alternate; loop: true; dur: 250; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.1" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.08 0.1" radius="0.07" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.18 0.1" radius="0.012" height="0.12" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0.04 0.1 0.15" radius="0.012" color="#e91e63"></a-sphere>
            <a-sphere position="0 0.04 -0.12" radius="0.035" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ป้ายข้อความ AR -->
      <a-text
        id="ar-label"
        value="RABBITS: HAPPY RUNNING\nSTATUS: NORMAL"
        position="0 0.85 0"
        rotation="-90 0 0"
        align="center"
        width="2.6"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
