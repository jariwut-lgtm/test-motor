<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Rabbits Running</title>

  <!-- Open-source libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      font-size: 15px;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 130px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }
    .hint { display: block; margin-top: 4px; font-size: 12px; opacity: 0.8; }
  </style>

  <script>
    // Component สั่งหมุนฝูงกระต่ายรอบแกน Y
    AFRAME.registerComponent('spin-control', {
      schema: {
        speed: { type: 'number', default: 120 },
        active: { type: 'boolean', default: true }
      },
      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;
        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        this.el.object3D.rotation.y += radians;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const rabbitGroup = document.querySelector('#rabbit-group');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');
      const rabbitBodies = document.querySelectorAll('.rabbit-body');

      let running = true;
      let panic = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — ฝูงกระต่ายพร้อมวิ่ง!<span class="hint">แตะปุ่มด้านล่างเพื่อควบคุม</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">ส่องไปที่แผ่น Marker บนโต๊ะ</span>';
      });

      // ปุ่มเริ่ม / หยุด วิ่ง
      runButton.addEventListener('click', () => {
        running = !running;
        rabbitGroup.setAttribute('spin-control', 'active', running);
        
        // สลับสถานะการกระโดด
        document.querySelectorAll('[animation]').forEach(el => {
          if (running) el.play(); else el.pause();
        });

        runButton.textContent = running ? 'หยุดวิ่ง' : 'เริ่มวิ่ง';
      });

      // ปุ่มจำลองตกใจ
      statusButton.addEventListener('click', () => {
        panic = !panic;

        if (panic) {
          rabbitBodies.forEach(b => b.setAttribute('color', '#ff8a80')); // เปลี่ยนกระต่ายเป็นสีส้ม/แดง
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'RABBITS: PANIC MODE!\nSPEED: FAST');
          rabbitGroup.setAttribute('spin-control', 'speed', 240); // วิ่งเร็วขึ้น 2 เท่า
          statusButton.textContent = 'กลับเป็นปกติ';
        } else {
          rabbitBodies.forEach(b => b.setAttribute('color', '#ffffff')); // กลับเป็นสีขาว
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'RABBITS: HAPPY RUNNING\nSTATUS: NORMAL');
          rabbitGroup.setAttribute('spin-control', 'speed', 120);
          statusButton.textContent = 'จำลองตื่นตกใจ';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้ใช้งานกล้องบนหน้าเว็บ</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">หยุดวิ่ง</button>
    <button id="status-button" type="button">จำลองตื่นตกใจ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker id="hiro-marker" preset="hiro" emitevents="true">

      <!-- 1. สนามหญ้าสีเขียว (Grass Field) -->
      <a-cylinder position="0 0.02 0" radius="0.7" height="0.04" color="#4caf50"></a-cylinder>
      <!-- ลู่วิ่งวงกลมสีน้ำตาล -->
      <a-ring position="0 0.045 0" rotation="-90 0 0" radius-inner="0.38" radius-outer="0.58" color="#795548"></a-ring>

      <!-- 2. แครอทตรงกลางสนาม (Carrot Landmark) -->
      <a-cone position="0 0.22 0" rotation="180 0 0" radius-bottom="0.1" radius-top="0.01" height="0.3" color="#ff9800"></a-cone>
      <a-sphere position="0 0.38 0" radius="0.07" color="#2e7d32" scale="1 0.3 1"></a-sphere>

      <!-- ไฟเตือนกลางสนาม -->
      <a-sphere id="warning-lamp" position="0 0.48 0" radius="0.04" color="#00e676" material="emissive: #00c853; emissiveIntensity: 0.8"></a-sphere>

      <!-- 3. กลุ่มกระต่าย 4 ตัววิ่งรอบแครอท -->
      <a-entity id="rabbit-group" position="0 0 0" spin-control="speed: 120; active: true">

        <!-- กระต่ายตัวที่ 1 -->
        <a-entity position="0.48 0 0" rotation="0 0 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.2 0; dir: alternate; loop: true; dur: 220; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.09" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere> <!-- ตัว -->
            <a-sphere class="rabbit-body" position="0 0.07 0.09" radius="0.065" color="#ffffff"></a-sphere> <!-- หัว -->
            <a-cylinder position="-0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder> <!-- หูซ้าย -->
            <a-cylinder position="0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 10 10" color="#ffcdd2"></a-cylinder> <!-- หูขวา -->
            <a-sphere position="-0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere> <!-- ตา -->
            <a-sphere position="0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0 0.03 -0.1" radius="0.03" color="#ffffff"></a-sphere> <!-- หาง -->
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 2 -->
        <a-entity position="0 0 -0.48" rotation="0 270 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.2 0; dir: alternate; loop: true; dur: 220; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.09" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.07 0.09" radius="0.065" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0 0.03 -0.1" radius="0.03" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 3 -->
        <a-entity position="-0.48 0 0" rotation="0 180 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.2 0; dir: alternate; loop: true; dur: 220; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.09" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.07 0.09" radius="0.065" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0 0.03 -0.1" radius="0.03" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

        <!-- กระต่ายตัวที่ 4 -->
        <a-entity position="0 0 0.48" rotation="0 90 0">
          <a-entity animation="property: position; from: 0 0.08 0; to: 0 0.2 0; dir: alternate; loop: true; dur: 220; easing: easeInOutSine">
            <a-sphere class="rabbit-body" position="0 0 0" radius="0.09" scale="0.9 0.8 1.3" color="#ffffff"></a-sphere>
            <a-sphere class="rabbit-body" position="0 0.07 0.09" radius="0.065" color="#ffffff"></a-sphere>
            <a-cylinder position="-0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 -10 -10" color="#ffcdd2"></a-cylinder>
            <a-cylinder position="0.03 0.16 0.09" radius="0.01" height="0.11" rotation="15 10 10" color="#ffcdd2"></a-cylinder>
            <a-sphere position="-0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0.035 0.09 0.14" radius="0.01" color="#d81b60"></a-sphere>
            <a-sphere position="0 0.03 -0.1" radius="0.03" color="#ffffff"></a-sphere>
          </a-entity>
        </a-entity>

      </a-entity>

      <!-- ป้ายข้อความ AR -->
      <a-text
        id="ar-label"
        value="RABBITS: HAPPY RUNNING\nSTATUS: NORMAL"
        position="0 0.75 0"
        rotation="-90 0 0"
        align="center"
        width="2.5"
        color="#ffffff"
        side="double"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
